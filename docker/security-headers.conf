# Included in every location, because an add_header inside a location drops the server-level ones.
# The app makes no third-party requests, so everything is locked to the own origin.
# Vite inlines small images and fonts as data: URIs, hence data: for img-src and font-src.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
