server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The service worker, its registration script and the HTML must be revalidated,
    # otherwise an installed PWA never sees a new version.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite puts a content hash in every file name under assets/, so these never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # There is no router, so unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
